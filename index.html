<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Contenedores · Dima Express</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Marca Dima Express: carbón del logo, plata y celeste #6EC1E4 del sitio. Layout: barra superior con pestañas; cada vista = resumen arriba, tabla operable abajo; formularios en panel modal */
:root{
  --bg:#F2F3F4; --surface:#FFFFFF; --sunk:#E9EBED; --line:#D4D8DC;
  --fg:#272626; --muted:#5F6366; --accent:#1F7FA8; --accent-fg:#FFFFFF; --accent-soft:#DCEFF8;
  --brand:#2B2B2B; --brand-2:#494949; --brand-fg:#F2F2F2; --brand-muted:#B9BDC0; --sky:#6EC1E4;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --warn:#A86200; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#F8DEDB; --info:#1F7FA8; --info-soft:#DCEFF8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141516; --surface:#1D1F20; --sunk:#26292A; --line:#34383A;
  --fg:#ECEDEE; --muted:#9EA3A6; --accent:#6EC1E4; --accent-fg:#0E1A20; --accent-soft:#18303B;
  --brand:#0E0F10; --brand-2:#2B2B2B; --brand-fg:#F2F2F2; --brand-muted:#9EA3A6; --sky:#6EC1E4;
  --ok:#6BC58D; --ok-soft:#173326; --warn:#E6A34A; --warn-soft:#3A2B14; --bad:#F08A80; --bad-soft:#3B1C1A; --info:#6EC1E4; --info-soft:#18303B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1D1F20; --sunk:#26292A; --line:#34383A;
  --fg:#ECEDEE; --muted:#9EA3A6; --accent:#6EC1E4; --accent-fg:#0E1A20; --accent-soft:#18303B;
  --brand:#0E0F10; --brand-2:#2B2B2B; --brand-fg:#F2F2F2; --brand-muted:#9EA3A6; --sky:#6EC1E4;
  --ok:#6BC58D; --ok-soft:#173326; --warn:#E6A34A; --warn-soft:#3A2B14; --bad:#F08A80; --bad-soft:#3B1C1A; --info:#6EC1E4; --info-soft:#18303B;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-bottom:3px solid var(--sky);color:var(--brand-fg)}
.hd{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:54px;width:auto;display:block}
.brand span{color:var(--brand-muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;border-left:1px solid var(--brand-2);padding-left:14px;line-height:1.3}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-muted);text-decoration:none;padding:6px 12px;border-radius:var(--r)}
nav a:hover{color:var(--brand-fg);background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{color:#10202A;background:var(--sky)}
main{padding-block:24px 64px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
button.sm{padding:4px 9px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:clamp(24px,2.4vw,34px);overflow-wrap:anywhere;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:8px}
.bar i{display:block;height:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel>.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-disp{color:var(--ok);background:var(--ok-soft)}
.p-arr{color:var(--info);background:var(--info-soft)}
.p-vend{color:var(--muted);background:var(--sunk)}
.p-mant{color:var(--warn);background:var(--warn-soft)}
.p-venc{color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type="search"]{max-width:280px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.note{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alert-list{display:flex;flex-direction:column}
.alert-list>div{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.alert-list>div:last-child{border-bottom:0}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:10px;border:1px solid var(--line);width:min(640px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
label.full{grid-column:1/-1}
.calc{background:var(--sunk);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13.5px}
.calc b{font-variant-numeric:tabular-nums;text-align:right}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:30;font-size:13.5px;max-width:calc(100% - 32px)}
.status{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
@media (max-width:640px){.brand img{height:36px}h1{font-size:25px}.tile .v{font-size:28px}nav{margin-left:0}}
.userbox{display:flex;align-items:center;gap:10px;color:var(--brand-muted);font-size:12.5px}
.userbox button{background:transparent;color:var(--brand-fg);border-color:var(--brand-2)}
.login{max-width:420px;margin:40px auto 0}
.login .pb{display:flex;flex-direction:column;gap:14px;padding:24px}

.tile .v{white-space:nowrap;font-size:clamp(20px,2.3vw,32px)}@media (max-width:640px){.tile .v{font-size:22px}}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}.lbl.full{grid-column:1/-1}
.combo{position:relative;flex:1;min-width:0}.combo-q{width:100%}
.combo-list{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 2px);max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.18);font-size:14px;color:var(--fg);font-weight:400}
.combo-op{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line)}.combo-op:last-child{border-bottom:0}.combo-op.act,.combo-op:hover{background:var(--accent-soft)}
.combo-op mark{background:transparent;color:var(--accent);font-weight:700}.combo-vacio{padding:9px 11px;color:var(--muted);font-size:13px}
a.tile{text-decoration:none;color:inherit}a.tile:hover{border-color:var(--accent)}
.tile.alerta .v{color:var(--bad)}
tr.clic{cursor:pointer}
td.trunc{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mas{padding:12px 16px;text-align:center;border-top:1px solid var(--line)}
.sel{width:auto;max-width:240px}
input.buscar{max-width:320px}
h3.sub{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0}
.modal.ancho{width:min(1000px,100%)}
table.items td{padding:5px 6px}table.items input{padding:5px 8px}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:4px 0}
a{color:var(--accent)}
nav{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}nav a{white-space:nowrap}
.hd{flex-wrap:wrap}
.userbox{margin-left:auto}
.login{max-width:440px;margin:40px auto 0}.login .pb{display:flex;flex-direction:column;gap:14px;padding:24px}
.userbox{display:flex;align-items:center;gap:10px;color:var(--brand-muted);font-size:12.5px}
.userbox button{background:transparent;color:var(--brand-fg);border-color:var(--brand-2)}
@media (max-width:900px){nav{order:3;width:100%}}
@media print{header,.noprint,.toast,#modal-root{display:none!important}body{background:#fff;color:#000}.panel{break-inside:avoid;border-color:#999}main{padding:0}a{color:#000;text-decoration:none}}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
