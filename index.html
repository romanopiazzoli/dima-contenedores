<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Contenedores · Dima Express</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Marca Dima Express: carbón del logo, plata y celeste #6EC1E4 del sitio. Layout: barra superior con pestañas; cada vista = resumen arriba, tabla operable abajo; formularios en panel modal */
:root{
  --bg:#F2F3F4; --surface:#FFFFFF; --sunk:#E9EBED; --line:#D4D8DC;
  --fg:#272626; --muted:#5F6366; --accent:#1F7FA8; --accent-fg:#FFFFFF; --accent-soft:#DCEFF8;
  --brand:#2B2B2B; --brand-2:#494949; --brand-fg:#F2F2F2; --brand-muted:#B9BDC0; --sky:#6EC1E4;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --warn:#A86200; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#F8DEDB; --info:#1F7FA8; --info-soft:#DCEFF8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141516; --surface:#1D1F20; --sunk:#26292A; --line:#34383A;
  --fg:#ECEDEE; --muted:#9EA3A6; --accent:#6EC1E4; --accent-fg:#0E1A20; --accent-soft:#18303B;
  --brand:#0E0F10; --brand-2:#2B2B2B; --brand-fg:#F2F2F2; --brand-muted:#9EA3A6; --sky:#6EC1E4;
  --ok:#6BC58D; --ok-soft:#173326; --warn:#E6A34A; --warn-soft:#3A2B14; --bad:#F08A80; --bad-soft:#3B1C1A; --info:#6EC1E4; --info-soft:#18303B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1D1F20; --sunk:#26292A; --line:#34383A;
  --fg:#ECEDEE; --muted:#9EA3A6; --accent:#6EC1E4; --accent-fg:#0E1A20; --accent-soft:#18303B;
  --brand:#0E0F10; --brand-2:#2B2B2B; --brand-fg:#F2F2F2; --brand-muted:#9EA3A6; --sky:#6EC1E4;
  --ok:#6BC58D; --ok-soft:#173326; --warn:#E6A34A; --warn-soft:#3A2B14; --bad:#F08A80; --bad-soft:#3B1C1A; --info:#6EC1E4; --info-soft:#18303B;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-bottom:3px solid var(--sky);color:var(--brand-fg)}
.hd{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:54px;width:auto;display:block}
.brand span{color:var(--brand-muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;border-left:1px solid var(--brand-2);padding-left:14px;line-height:1.3}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-muted);text-decoration:none;padding:6px 12px;border-radius:var(--r)}
nav a:hover{color:var(--brand-fg);background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{color:#10202A;background:var(--sky)}
main{padding-block:24px 64px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
button.sm{padding:4px 9px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:clamp(24px,2.4vw,34px);overflow-wrap:anywhere;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:8px}
.bar i{display:block;height:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel>.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-disp{color:var(--ok);background:var(--ok-soft)}
.p-arr{color:var(--info);background:var(--info-soft)}
.p-vend{color:var(--muted);background:var(--sunk)}
.p-mant{color:var(--warn);background:var(--warn-soft)}
.p-venc{color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type="search"]{max-width:280px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.note{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alert-list{display:flex;flex-direction:column}
.alert-list>div{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.alert-list>div:last-child{border-bottom:0}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:10px;border:1px solid var(--line);width:min(640px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
label.full{grid-column:1/-1}
.calc{background:var(--sunk);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13.5px}
.calc b{font-variant-numeric:tabular-nums;text-align:right}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:30;font-size:13.5px;max-width:calc(100% - 32px)}
.status{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
@media (max-width:640px){.brand img{height:36px}h1{font-size:25px}.tile .v{font-size:28px}nav{margin-left:0}}
.userbox{display:flex;align-items:center;gap:10px;color:var(--brand-muted);font-size:12.5px}
.userbox button{background:transparent;color:var(--brand-fg);border-color:var(--brand-2)}
.login{max-width:420px;margin:40px auto 0}
.login .pb{display:flex;flex-direction:column;gap:14px;padding:24px}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
import {SUPABASE_URL,SUPABASE_ANON_KEY} from "./supabase-config.js";
const TIPO_LINK=(location.hash.match(/type=(\w+)/)||[])[1]||""; // invite / recovery, leído antes de que supabase limpie la URL
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
// Adaptador: misma interfaz de documentos que usaba la versión de claude.ai.
// Cada tabla (contenedores, clientes, movimientos, config) tiene columnas id (texto) y data (jsonb).
const TABLAS={};
function tabla(n){
  if(TABLAS[n])return TABLAS[n];
  const t={map:new Map(),subs:new Set(),listo:false,canal:null};
  t.emit=()=>{const docs=[...t.map.entries()].map(([id,d])=>({id,data:()=>d}));t.subs.forEach(f=>f.next({docs,metadata:{fromCache:false}}))};
  return TABLAS[n]=t;
}
async function cargarTabla(n){
  const t=tabla(n);let desde=0;const paso=1000;
  for(;;){const {data,error}=await sb.from(n).select("id,data").range(desde,desde+paso-1);
    if(error)throw error;data.forEach(r=>t.map.set(r.id,r.data));if(data.length<paso)break;desde+=paso}
  t.listo=true;t.emit();
}
function escuchar(n){
  const t=tabla(n);if(t.canal)return;
  t.canal=sb.channel("rt-"+n).on("postgres_changes",{event:"*",schema:"public",table:n},p=>{
    if(p.eventType==="DELETE"){t.map.delete(p.old.id)}else{t.map.set(p.new.id,p.new.data)}
    if(t.listo)t.emit();
  }).subscribe();
}
const sep=p=>{const i=p.indexOf("/");return[p.slice(0,i),p.slice(i+1)]};
const nuevoId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);
function refDoc(n,id){
  const t=tabla(n);

        await S.db.doc("movimientos/"+m.id).update({fechaIngreso:f,obsIngreso:obs,actualizado:Date.now()});
        if(c)await S.db.doc("contenedores/"+c.id).update({estado:fval(sc,"f-est"),actualizado:Date.now()});
      },"Ingreso registrado");
      if(ok)closeModal();
    };
  });
}

// Historial de un contenedor
function verHistorial(c){
  const movs=[...S.movs.values()].filter(m=>m.contenedorId===c.id).sort((a,b)=>b.fechaSalida.localeCompare(a.fechaSalida));
  const totalHist=movs.reduce((s,m)=>s+calcMov(m).neto,0);
  const rows=movs.map(m=>{const r=calcMov(m);return`<tr><td>${m.tipo==="venta"?"Venta":"Arriendo"}</td><td>${esc(cliName(m.clienteId))}</td><td>${fdate(m.fechaSalida)}</td><td>${m.tipo==="venta"?"—":(m.fechaIngreso?fdate(m.fechaIngreso):'<span class="pill p-arr">En terreno</span>')}</td><td class="num">${m.tipo==="venta"?"—":r.dias}</td><td class="num">${clp(r.neto)}</td></tr>`}).join("");
  modal("Historial "+c.codigo,`
  <dl class="kv"><dt>Tipo</dt><dd>${esc(c.tipo)}${c.dimension?" · "+esc(c.dimension):""}${c.caracteristica?" · "+esc(c.caracteristica):""}</dd><dt>Estado</dt><dd>${pill(estadoCont(c))}${c.vendidoA?" a "+esc(c.vendidoA):""}</dd><dt>Ubicación</dt><dd>${esc(c.ubicacion||"—")}</dd><dt>Precios</dt><dd>${clp(c.precioMes)}/mes · ${clp(c.precioDia)}/día · venta ${clp(c.precioVenta)}</dd><dt>Generado</dt><dd><b>${clp(totalHist)}</b> neto en ${movs.length} movimiento(s)</dd>${c.notas?`<dt>Notas</dt><dd>${esc(c.notas)}</dd>`:""}</dl>
  <div class="scroll panel">${movs.length?`<table><thead><tr><th>Tipo</th><th>Cliente</th><th>Salida</th><th>Ingreso</th><th class="num">Días</th><th class="num">Neto</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Este contenedor aún no tiene movimientos.</div>`}</div>`,
  `<button class="danger" id="h-del">Eliminar contenedor</button><span style="flex:1"></span><button id="h-edit">Editar</button>${estadoCont(c)==="disponible"?`<button class="primary" id="h-arr">Arrendar</button>`:""}`,sc=>{

  });
}
function verCliente(c){
  const movs=[...S.movs.values()].filter(m=>m.clienteId===c.id).sort((a,b)=>b.fechaSalida.localeCompare(a.fechaSalida));
  const rows=movs.map(m=>{const r=calcMov(m);return`<tr><td class="mono">${esc(contCode(m.contenedorId))}</td><td>${m.tipo==="venta"?"Venta":"Arriendo "+(m.modalidad||"")}</td><td>${fdate(m.fechaSalida)}</td><td>${m.tipo==="venta"?"—":(m.fechaIngreso?fdate(m.fechaIngreso):'<span class="pill p-arr">En terreno</span>')}</td><td class="num">${clp(r.neto)}</td></tr>`}).join("");

  <div class="scroll panel">${movs.length?`<table><thead><tr><th>Contenedor</th><th>Operación</th><th>Salida</th><th>Ingreso</th><th class="num">Neto</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Sin arriendos ni compras registradas.</div>`}</div>`,
  `<button class="danger" id="c-del">Eliminar cliente</button><span style="flex:1"></span><button id="c-edit">Editar</button>`,sc=>{
    sc.querySelector("#c-edit").onclick=()=>formCliente(c);

  modal(arr?"Arriendo":"Venta",`
  <dl class="kv"><dt>Contenedor</dt><dd class="mono">${esc(contCode(m.contenedorId))} · ${esc(c?.tipo||"")}</dd><dt>Cliente</dt><dd>${esc(cliName(m.clienteId))}</dd>
  <dt>${arr?"Salida":"Fecha"}</dt><dd>${fdate(m.fechaSalida)}</dd>
  ${arr?`<dt>Término estimado</dt><dd>${fdate(m.fechaFinEstimada)} ${vencido(m)?'<span class="pill p-venc">Vencido</span>':""}</dd><dt>Ingreso</dt><dd>${m.fechaIngreso?fdate(m.fechaIngreso):"Aún en terreno"}</dd><dt>Tarifa</dt><dd>${clp(m.tarifa)} / ${m.modalidad==="diario"?"día":"mes"}${m.flete?" · flete "+clp(m.flete):""}</dd>`:""}
  <dt>${arr?"Guía":"Factura"}</dt><dd>${esc(m.guia||"—")}</dd><dt>Dirección</dt><dd>${esc(m.obra||"—")}</dd>${m.notas?`<dt>Notas</dt><dd>${esc(m.notas)}</dd>`:""}${m.obsIngreso?`<dt>Recepción</dt><dd>${esc(m.obsIngreso)}</dd>`:""}</dl>
  <div class="calc"><span>${arr?`${r.dias} días · ${r.periodos} ${m.modalidad==="diario"?"día(s)":"mes(es)"}${r.minimo?" (mínimo "+MIN_MESES+" meses)":""}${m.fechaIngreso?"":" a la fecha"}`:"Precio neto"}</span><b>${clp(r.neto)}</b><span>IVA 19%</span><b>${clp(r.iva)}</b><span class="tot">Total</span><b class="tot">${clp(r.total)}</b></div>`,
  `<button class="danger" id="m-del">Eliminar</button><span style="flex:1"></span><button id="m-edit">Editar</button>${arr&&!m.fechaIngreso?`<button class="primary" id="m-ing">Registrar ingreso</button>`:""}`,sc=>{

// ---------- Vistas ----------
function exampleNote(){
  if(!S.importando&&S.loaded.conts&&S.loaded.clis&&S.loaded.movs&&S.conts.size===0)return `<div class="note"><span>La base de datos está vacía. Carga el archivo <b>datos-iniciales.json</b> (está en tu carpeta Documentos › Dima plataforma) o un <b>respaldo</b> descargado desde esta plataforma. Toma 1 a 2 minutos.</span><label class="btn sm primary" style="flex-direction:row;color:var(--accent-fg);background:var(--accent);border-color:var(--accent);cursor:pointer">Elegir archivo…<input type="file" id="imp-file" accept=".json,application/json" hidden></label></div>`;
  if(S.importando)return `<div class="note"><span>Cargando datos… ${S.importando.hechos} de ${S.importando.total}. No cierres esta página.</span></div>`;
  const n=[...S.conts.values(),...S.clis.values(),...S.movs.values()].filter(x=>x.ejemplo).length;
  return n?`<div class="note"><span>Hay ${n} registros de <b>ejemplo</b> para que veas cómo funciona. Bórralos cuando empieces a cargar tus datos reales.</span><button class="sm" id="del-ej">Borrar datos de ejemplo</button></div>`:"";
}
function vistaPanel(){
  const conts=[...S.conts.values()];
  const cnt={disponible:0,arrendado:0,vendido:0,mantencion:0};conts.forEach(c=>cnt[estadoCont(c)]++);
  const flota=conts.length-cnt.vendido;
  const activos=[...S.movs.values()].filter(m=>m.tipo==="arriendo"&&!m.fechaIngreso);
  const mensual=activos.reduce((s,m)=>s+(m.modalidad==="diario"?num(m.tarifa)*30:num(m.tarifa)),0);
  const acumulado=activos.reduce((s,m)=>s+calcMov(m).neto,0);
  const mesIni=hoy().slice(0,7);
  const ventasMes=[...S.movs.values()].filter(m=>m.tipo==="venta"&&m.fechaSalida.startsWith(mesIni)).reduce((s,m)=>s+num(m.precio),0);
  const ocup=flota?Math.round(cnt.arrendado/flota*100):0;
  const alertas=activos.filter(m=>vencido(m)||porVencer(m)).sort((a,b)=>a.fechaFinEstimada.localeCompare(b.fechaFinEstimada));
  const terreno=activos.sort((a,b)=>a.fechaSalida.localeCompare(b.fechaSalida));
  const w=k=>flota?(cnt[k]/flota*100):0;
  return `${exampleNote()}
  <div class="row between"><h1>Panel</h1><div class="row"><button id="q-arr" class="primary">Registrar salida</button><button id="q-ven">Registrar venta</button></div></div>
  <div class="tiles">
    <div class="tile"><span class="k">Total contenedores</span><span class="v">${flota}</span><span class="s">${cnt.disponible} disponibles · ${cnt.arrendado} fuera · ${cnt.mantencion} en mantención</span>
      <div class="bar" aria-hidden="true"><i style="width:${w("arrendado")}%;background:var(--info)"></i><i style="width:${w("disponible")}%;background:var(--ok)"></i><i style="width:${w("mantencion")}%;background:var(--warn)"></i></div></div>
    <div class="tile"><span class="k">Fuera (arrendados)</span><span class="v">${cnt.arrendado}</span><span class="s">${ocup}% de ocupación</span></div>
    <div class="tile"><span class="k">Disponibles</span><span class="v">${cnt.disponible}</span><span class="s">${cnt.mantencion} en mantención</span></div>
    <div class="tile"><span class="k">Arriendo mensual activo</span><span class="v">${clp(mensual)}</span><span class="s">neto · diarios ×30</span></div>
    <div class="tile"><span class="k">Generado por arriendos en curso</span><span class="v">${clp(acumulado)}</span><span class="s">neto, desde que salió cada contenedor</span></div>
    <div class="tile"><span class="k">Ventas este mes</span><span class="v">${clp(ventasMes)}</span><span class="s">neto</span></div>
  </div>
  ${tablaTipos(conts)}
  <div class="panel"><div class="ph"><h2>Alertas de término</h2><span class="status">Vencidos o que terminan en los próximos 7 días</span></div><div class="pb">
    ${alertas.length?`<div class="alert-list">${alertas.map(m=>`<div><span><span class="mono">${esc(contCode(m.contenedorId))}</span> · ${esc(cliName(m.clienteId))}</span><span class="row">${vencido(m)?`<span class="pill p-venc">Vencido hace ${dias(m.fechaFinEstimada,hoy())} días</span>`:`<span class="pill p-mant">Termina ${fdate(m.fechaFinEstimada)}</span>`}<button class="sm" data-ing="${m.id}">Registrar ingreso</button></span></div>`).join("")}</div>`:`<p class="muted" style="margin:0">Ningún arriendo vence esta semana.</p>`}
  </div></div>
  <div class="panel"><div class="ph"><h2>Contenedores en terreno</h2><span class="status">${terreno.length} arriendos activos</span></div>
    ${terreno.length?`<div class="scroll"><table><thead><tr><th>Contenedor</th><th>Tipo</th><th>Cliente</th><th>Obra</th><th>Salida</th><th class="num">Días</th><th class="num">Tarifa</th><th class="num">Acumulado neto</th></tr></thead><tbody>
    ${terreno.map(m=>{const r=calcMov(m),c=S.conts.get(m.contenedorId);return`<tr data-mov="${m.id}" style="cursor:pointer"><td class="mono">${esc(contCode(m.contenedorId))}</td><td>${esc(c?.tipo||"")}</td><td>${esc(cliName(m.clienteId))}</td><td>${esc(m.obra||"—")}</td><td>${fdate(m.fechaSalida)}</td><td class="num">${r.dias}</td><td class="num">${clp(m.tarifa)}/${m.modalidad==="diario"?"día":"mes"}</td><td class="num">${clp(r.neto)}</td></tr>`}).join("")}
    </tbody></table></div>`:`<div class="empty"><b>Nada en terreno</b>Cuando registres una salida en arriendo aparecerá aquí con sus días y monto acumulado.</div>`}
  </div>`;
}
function tablaTipos(conts){
  const g={};
  conts.forEach(c=>{const e=estadoCont(c);if(e==="vendido")return;const t=c.tipo||"Otro";g[t]=g[t]||{total:0,disponible:0,arrendado:0,mantencion:0};g[t].total++;g[t][e]++});
  const tipos=Object.keys(g).sort((a,b)=>{const ia=TIPOS.indexOf(a),ib=TIPOS.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  if(!tipos.length)return "";
  const T={total:0,disponible:0,arrendado:0,mantencion:0};tipos.forEach(t=>{for(const k in T)T[k]+=g[t][k]});
  const cell=(n,cls)=>n?`<td class="num"><span class="pill ${cls}">${n}</span></td>`:`<td class="num muted">0</td>`;
  const barra=r=>`<div class="bar" style="margin:0;min-width:90px" aria-hidden="true"><i style="width:${r.disponible/r.total*100}%;background:var(--ok)"></i><i style="width:${r.arrendado/r.total*100}%;background:var(--info)"></i><i style="width:${r.mantencion/r.total*100}%;background:var(--warn)"></i></div>`;
  return `<div class="panel"><div class="ph"><h2>Contenedores por tipo</h2><span class="status"><span style="color:var(--ok)">●</span> Disponible &nbsp;<span style="color:var(--info)">●</span> Fuera &nbsp;<span style="color:var(--warn)">●</span> Mantención</span></div>
  <div class="scroll"><table><thead><tr><th>Tipo</th><th class="num">Total</th><th class="num">Disponibles</th><th class="num">Fuera</th><th class="num">Mantención</th><th style="width:30%">Distribución</th></tr></thead><tbody>
  ${tipos.map(t=>{const r=g[t];return`<tr><td>${esc(t)}</td><td class="num"><b>${r.total}</b></td>${cell(r.disponible,"p-disp")}${cell(r.arrendado,"p-arr")}${cell(r.mantencion,"p-mant")}<td>${barra(r)}</td></tr>`}).join("")}
  </tbody><tfoot><tr><td><b>Total</b></td><td class="num"><b>${T.total}</b></td><td class="num"><b>${T.disponible}</b></td><td class="num"><b>${T.arrendado}</b></td><td class="num"><b>${T.mantencion}</b></td><td>${barra(T)}</td></tr></tfoot></table></div></div>`;
}

  <div class="chips">${chip("todos","Todos")}${chip("activos","Arriendos en curso")}${chip("cerrados","Arriendos cerrados")}${chip("ventas","Ventas")}</div>
  <div class="panel">${list.length?`<div class="scroll"><table><thead><tr><th>Operación</th><th>Contenedor</th><th>Cliente</th><th>Salida</th><th>Ingreso</th><th class="num">Días</th><th class="num">Neto</th><th class="num">Total c/IVA</th><th></th></tr></thead><tbody>
  ${list.map(m=>{const r=calcMov(m);const arr=m.tipo==="arriendo";return`<tr><td>${arr?`<button class="link" data-mov="${m.id}">Arriendo ${m.modalidad==="diario"?"diario":"mensual"}</button>`:`<button class="link" data-mov="${m.id}">Venta</button>`}</td><td class="mono">${esc(contCode(m.contenedorId))}</td><td>${esc(cliName(m.clienteId))}</td><td>${fdate(m.fechaSalida)}</td><td>${!arr?"—":m.fechaIngreso?fdate(m.fechaIngreso):(vencido(m)?'<span class="pill p-venc">Vencido</span>':'<span class="pill p-arr">En terreno</span>')}</td><td class="num">${arr?r.dias:"—"}</td><td class="num">${clp(r.neto)}</td><td class="num">${clp(r.total)}</td><td class="num">${arr&&!m.fechaIngreso?`<button class="sm" data-ing="${m.id}">Registrar ingreso</button>`:""}</td></tr>`}).join("")}
  </tbody><tfoot><tr><td colspan="6"><b>Total ${list.length} movimientos</b></td><td class="num"><b>${clp(tot)}</b></td><td class="num"><b>${clp(tot*(1+IVA))}</b></td><td></td></tr></tfoot></table></div>`:`<div class="empty"><b>Sin movimientos</b>Registra la salida de un contenedor en arriendo o una venta para empezar el historial.</div>`}</div>
  <p class="small muted" style="margin:0">Arriendo mínimo: ${MIN_MESES} meses, aunque el contenedor vuelva antes. Arriendo mensual: se cobra cada mes iniciado desde la fecha de salida. Arriendo diario: se cobra por día, con mínimo equivalente a ${MIN_MESES} meses. Los montos de arriendos en curso se calculan hasta hoy.</p>`;
}

// ---------- Render ----------
const VISTAS={panel:vistaPanel,contenedores:vistaContenedores,clientes:vistaClientes,movimientos:vistaMovimientos};
function ruta(){const h=location.hash.slice(1);return VISTAS[h]?h:"panel"}
function render(){
  const r=ruta();
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+r?"page":"false"));
  if(!S.db){return}
  if(!(S.loaded.conts&&S.loaded.clis&&S.loaded.movs)){
    $("#app").innerHTML=`<div class="empty"><b>${S.stale?"No se pudo conectar todavía":"Cargando datos…"}</b>${S.stale?"Revisa tu conexión; la página seguirá intentando.":"Conectando con la base de datos compartida de tu equipo."}</div>`;return}
  const act=document.activeElement,aid=act&&act.id,pos=act&&act.selectionStart;
  $("#app").innerHTML=(S.stale?`<div class="note">Los datos podrían no estar actualizados: no hay conexión con la base de datos.</div>`:"")+VISTAS[r]();
  if(aid){const el=document.getElementById(aid);if(el&&el.tagName==="INPUT"){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,tr[data-mov]");if(!t||t.closest("#modal-root"))return;
  const d=t.dataset;
  if(t.id==="add-cont")formContenedor();
  else if(t.id==="add-cli")formCliente();
  else if(t.id==="q-arr")formMovimiento("arriendo");
  else if(t.id==="q-ven")formMovimiento("venta");
  else if(t.id==="csv")exportarCSV();
  else if(t.id==="respaldo")respaldo();
  else if(t.id==="del-ej")borrarEjemplos();
  else if(d.hist)verHistorial(S.conts.get(d.hist));
  else if(d.cli)verCliente(S.clis.get(d.cli));
  else if(d.mov)verMovimiento(S.movs.get(d.mov));
  else if(d.arr)formMovimiento("arriendo",null,d.arr);
  else if(d.ven)formMovimiento("venta",null,d.ven);
  else if(d.ing)formIngreso(S.movs.get(d.ing));
  else if(d.lib)guardar(()=>S.db.doc("contenedores/"+d.lib).update({estado:"disponible",actualizado:Date.now()}),"Contenedor disponible");
  else if(d.fc){S.filtro.cont=d.fc;render()}
  else if(d.fm){S.filtro.mov=d.fm;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q-cont"){S.filtro.q=e.target.value;render()}
  if(e.target.id==="q-cli"){S.filtro.cli=e.target.value;render()}
});
window.addEventListener("hashchange",()=>{closeModal();render();window.scrollTo(0,0)});

function aLista(o){
  if(Array.isArray(o))return o.filter(x=>x&&x.c&&x.id&&x.d);
  const out=[];for(const c of ["contenedores","clientes","movimientos"])(o&&o[c]||[]).forEach(x=>{if(x&&x.id){const {id,...d}=x;out.push({c,id,d})}});return out;
}
async function leerArchivo(input){
  const f=input.files&&input.files[0];if(!f)return;
  try{const lista=aLista(JSON.parse(await f.text()));if(!lista.length){toast("El archivo no tiene datos de la plataforma.");return}importar(lista)}
  catch(e){toast("No se pudo leer el archivo. Debe ser datos-iniciales.json o un respaldo de esta plataforma.")}
  input.value="";
}
document.addEventListener("change",e=>{
  if(e.target.id==="imp-file")leerArchivo(e.target);
  if(e.target.id==="rest-file")leerArchivo(e.target);
});
async function importar(lista){
  if(S.importando)return;
  const ej=[...[...S.movs.values()].filter(x=>x.ejemplo).map(x=>"movimientos/"+x.id),...[...S.conts.values()].filter(x=>x.ejemplo).map(x=>"contenedores/"+x.id),...[...S.clis.values()].filter(x=>x.ejemplo).map(x=>"clientes/"+x.id)];
  const tareas=[...ej.map(p=>({del:p})),...lista.map(x=>({path:x.c+"/"+x.id,d:{...x.d,creado:Date.now()}}))];
  S.importando={hechos:0,total:tareas.length};render();
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));let fallos=0,i=0;
  const worker=async()=>{while(i<tareas.length){const t=tareas[i++];
    for(let k=0;k<6;k++){try{if(t.del)await S.db.doc(t.del).delete();else await S.db.doc(t.path).set(t.d);break}
      catch(e){if(e&&e.code==="invalid_argument"&&!t.del){fallos++;break}if(k===5){fallos++;break}await sleep(800*(k+1)+Math.random()*400)}}
    S.importando.hechos++;if(S.importando.hechos%25===0)render()}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  try{await S.db.doc("config/importacion").set({fecha:new Date().toISOString(),registros:lista.length,fallos})}catch(e){}
  S.importando=null;render();
  toast(fallos?`Importación terminada con ${fallos} registros sin guardar. Vuelve a intentarlo.`:"Importación terminada");
}
function borrarEjemplos(){
  const docs=[...[...S.movs.values()].map(x=>"movimientos/"+x.id+"|"+(x.ejemplo?1:0)),...[...S.conts.values()].map(x=>"contenedores/"+x.id+"|"+(x.ejemplo?1:0)),...[...S.clis.values()].map(x=>"clientes/"+x.id+"|"+(x.ejemplo?1:0))].filter(s=>s.endsWith("|1")).map(s=>s.slice(0,-2));
  confirmar(`¿Borrar los ${docs.length} registros de ejemplo? Tus datos reales no se tocan.`,async()=>{for(const p of docs)await S.db.doc(p).delete()});
}
function respaldo(){
  const o={fecha:new Date().toISOString(),contenedores:[...S.conts.values()],clientes:[...S.clis.values()],movimientos:[...S.movs.values()]};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));
  a.download="respaldo-dima-"+hoy()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast("Respaldo descargado: "+o.contenedores.length+" contenedores, "+o.clientes.length+" clientes, "+o.movimientos.length+" movimientos");
}
async function exportarCSV(){
  const rows=[["Operación","Modalidad","Contenedor","Tipo contenedor","Cliente","RUT","Salida","Término estimado","Ingreso","Días","Tarifa","Flete","Neto","IVA","Total","Guía/Factura","Obra"]];
  [...S.movs.values()].sort((a,b)=>a.fechaSalida.localeCompare(b.fechaSalida)).forEach(m=>{const r=calcMov(m),c=S.conts.get(m.contenedorId),cl=S.clis.get(m.clienteId);
    rows.push([m.tipo,m.modalidad||"",contCode(m.contenedorId),c?.tipo||"",cliName(m.clienteId),cl?.rut||"",m.fechaSalida,m.fechaFinEstimada||"",m.fechaIngreso||"",m.tipo==="arriendo"?r.dias:"",m.tarifa||m.precio||0,m.flete||0,Math.round(r.neto),Math.round(r.iva),Math.round(r.total),m.guia||"",m.obra||""])});
  const csv="﻿"+rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="movimientos-dima-"+hoy()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

// ---------- Datos ----------
// ---------- Inicio de sesión ----------
function pantallaLogin(msg){
  $("#nav").hidden=true;$("#userbox").hidden=true;
  $("#app").innerHTML=`<div class="login panel"><div class="pb">
    <h1>Ingresar</h1><p class="muted" style="margin:0">Plataforma interna de control de contenedores.</p>
    <form id="f-login" class="fg" style="grid-template-columns:1fr">
      <label>Correo<input id="l-email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="l-pass" type="password" autocomplete="current-password" required></label>
      <p id="l-msg" class="small" style="margin:0;color:var(--bad)">${esc(msg||"")}</p>
      <button class="primary" type="submit" id="l-btn">Entrar</button>
      <button class="link" type="button" id="l-reset">Olvidé mi contraseña</button>
    </form></div></div>`;
  $("#f-login").addEventListener("submit",async e=>{e.preventDefault();$("#l-btn").disabled=true;$("#l-msg").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pass").value});
    if(error){$("#l-btn").disabled=false;$("#l-msg").textContent=/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":/rate|many/i.test(error.message)?"Demasiados intentos. Espera unos minutos.":/confirm/i.test(error.message)?"Tu correo aún no está confirmado.":"No se pudo ingresar. Revisa tu conexión."}});
  $("#l-reset").onclick=async()=>{const em=$("#l-email").value.trim();if(!em){$("#l-msg").textContent="Escribe tu correo y vuelve a presionar.";return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error){$("#l-msg").textContent="No se pudo enviar el correo."}else{$("#l-msg").style.color="var(--ok)";$("#l-msg").textContent="Te enviamos un correo para crear una nueva contraseña."}};
}
function pantallaNuevaClave(){
  $("#nav").hidden=true;$("#userbox").hidden=true;
  $("#app").innerHTML=`<div class="login panel"><div class="pb"><h1>${TIPO_LINK==="invite"?"Bienvenido: crea tu contraseña":"Nueva contraseña"}</h1>
    <form id="f-np" class="fg" style="grid-template-columns:1fr">
      <label>Nueva contraseña (mínimo 8 caracteres)<input id="np-1" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repite la contraseña<input id="np-2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p id="np-msg" class="small" style="margin:0;color:var(--bad)"></p>
      <button class="primary" type="submit">Guardar contraseña</button></form></div></div>`;
  $("#f-np").addEventListener("submit",async e=>{e.preventDefault();
    if($("#np-1").value!==$("#np-2").value){$("#np-msg").textContent="Las contraseñas no coinciden.";return}
    const {error}=await sb.auth.updateUser({password:$("#np-1").value});
    if(error){$("#np-msg").textContent="No se pudo guardar. El enlace puede haber vencido: pide otro."}else{location.hash="";location.reload()}});
}
let iniciado=false,recuperando=false;
function entrar(u){
  if(iniciado||recuperando)return;iniciado=true;
  $("#nav").hidden=false;$("#userbox").hidden=false;$("#useremail").textContent=u.email||"";
  $("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  $("#app").innerHTML=`<div class="empty"><b>Cargando datos…</b></div>`;
  iniciar();
}
sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev==="PASSWORD_RECOVERY"){recuperando=true;pantallaNuevaClave();return}
  if(ses&&ses.user&&(TIPO_LINK==="invite"||TIPO_LINK==="recovery")&&!recuperando){recuperando=true;pantallaNuevaClave();return}
  if(ses&&ses.user){setTimeout(()=>entrar(ses.user),0)}
  else if(ev==="SIGNED_OUT"||ev==="INITIAL_SESSION"){if(!iniciado&&!recuperando)pantallaLogin()}
});
function iniciar(){(async()=>{
  const db=FDB;
  S.db=db;
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  const sub=(name,key)=>db.collection(name).onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S[key]=m;
    S.loaded[key]=true;
    if(!snap.metadata.fromCache&&S.loaded.conts&&S.loaded.clis&&S.loaded.movs){clearTimeout(timer);S.stale=false}
    render();
  },err=>{clearTimeout(timer);S.loaded[key]=true;S.stale=true;render()});
  sub("contenedores","conts");sub("clientes","clis");sub("movimientos","movs");
})()}
})();
</script>
